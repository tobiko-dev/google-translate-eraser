<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Google Translate Eraser</title>
  <desc id="desc">One key. Next image. A lavender eraser icon and a backtick key on a dark blue background.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#151c32"/><stop offset="1" stop-color="#242345"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#c6b7ff"/><stop offset="1" stop-color="#88baff"/></linearGradient>
  </defs>
  <rect width="1280" height="440" rx="28" fill="url(#bg)"/>
  <circle cx="1180" cy="18" r="250" fill="#8caeff" opacity=".045"/>
  <circle cx="1060" cy="430" r="210" fill="#c4a9ff" opacity=".045"/>
  <g transform="translate(70 65)">
    <rect width="68" height="68" rx="20" fill="url(#accent)"/>
    <path d="M19 39 37 20Q40 17 43 20L52 29Q55 32 52 35L34 54H26L19 47Q15 43 19 39Z" fill="#232943"/>
    <path d="m25 33 17 17" stroke="#b9b8ff" stroke-width="3"/>
  </g>
  <text x="160" y="105" fill="#dddff8" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700">GOOGLE TRANSLATE ERASER</text>
  <text x="70" y="231" fill="#f5f4ff" font-family="DejaVu Sans, sans-serif" font-size="66" font-weight="700">One key. Next image.</text>
  <text x="74" y="285" fill="#acb8d5" font-family="DejaVu Sans, sans-serif" font-size="25">Clear your translation. Paste another screenshot.</text>
  <rect x="74" y="335" width="286" height="39" rx="19" fill="#ffffff" opacity=".065"/>
  <text x="96" y="361" fill="#c4cfeb" font-family="DejaVu Sans, sans-serif" font-size="18">EDGE · BRAVE · FIREFOX</text>
  <g transform="translate(1010 154) rotate(8 74 74)">
    <rect x="0" y="12" width="148" height="148" rx="27" fill="#080e20" opacity=".6"/>
    <rect width="148" height="148" rx="27" fill="url(#accent)"/>
    <rect x="12" y="10" width="124" height="116" rx="20" fill="#e4dcff" opacity=".45"/>
    <text x="52" y="105" fill="#252942" font-family="DejaVu Sans, sans-serif" font-size="110">`</text>
  </g>
</svg>
